<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typeset demo</title>
<style>
  :root { --bg: #000; --ink: #f3eee4; --muted: #8a8580; --rule: #c7a59a; --accent: #e9a24f; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { padding: 24px 16px; font: 17px/25px "Source Serif 4", serif; }
  h1 { font: 600 22px/1 Antonio, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 28px; margin-bottom: 36px; }
  figure { margin: 0; }
  figcaption { font: 13px/1.3 sans-serif; color: var(--muted); margin-bottom: 8px; }
  .browser { text-align: justify; hyphens: auto; overflow-wrap: anywhere; }
  .frame { outline: 1px dashed #333; }
</style>
</head>
<body>
<h1>pocketview typeset</h1>
<div id="out"></div>
<script type="module" src="./main.ts"></script>
</body>
</html>
