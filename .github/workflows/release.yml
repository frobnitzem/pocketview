name: Publish to npm

# Publishing a GitHub release (tag vX.Y.Z) tests and publishes every package
# under packages/ to npm, with provenance. Needs the repository secret
# NPM_TOKEN: an npm automation token with publish rights to @pocketview.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: The tag matches the package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in packages/*/package.json; do
            v=$(node -p "require('./$p').version")
            [ "$v" = "$tag" ] || { echo "$p is $v, the release is $tag"; exit 1; }
          done
      - run: pnpm licenses:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm -r --filter "./packages/*" publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
