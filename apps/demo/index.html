<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="pocketview: a JSON and YAML viewer with publication-quality typesetting.">
<title>pocketview</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M2 30V12A10 10 0 0 1 12 2h18v8H14a4 4 0 0 0-4 4v16z' fill='%23e9a24f'/%3E%3C/svg%3E">
</head>
<body>
<div class="app" id="app">
  <section class="editor-pane" id="editor-pane">
    <header class="pane-head">
      <button id="sheet-toggle" class="sheet-toggle" aria-label="Collapse editor" aria-expanded="true">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
      </button>
      <span class="label">input</span>
      <button id="settings-open" class="icon-btn" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4L10.6 6a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
      </button>
      <select id="mode" aria-label="Input format">
        <option value="auto">auto</option>
        <option value="json">JSON</option>
        <option value="yaml">YAML</option>
        <option value="text">text</option>
      </select>
    </header>
    <div class="editor" id="editor"></div>
    <footer class="pane-foot">
      <span id="status" class="status" role="status"></span>
      <button id="send" class="send" aria-label="Show in view (Ctrl+Enter)" title="Show (Ctrl+Enter)">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M4 11h12.2l-5.6-5.6L12 4l8 8-8 8-1.4-1.4 5.6-5.6H4z"/></svg>
      </button>
    </footer>
  </section>
  <main class="view" id="view" tabindex="-1"></main>
</div>

<dialog id="settings" class="settings">
  <form method="dialog">
    <header><h2>settings</h2><button class="icon-btn close" value="close" aria-label="Close">&times;</button></header>
    <label class="row select-row"><span><b>Colour scheme</b></span>
      <select id="opt-theme" aria-label="Colour scheme"></select></label>
    <label class="row"><input type="checkbox" id="opt-diagnostics">
      <span><b>Layout diagnostics</b><br><small>Mark lines whose paragraph could not be set optimally:
      <span class="q q-loose">loose</span> <span class="q q-emergency">emergency</span> <span class="q q-overfull">overfull</span>.
      Hover a marked line for its adjustment ratio.</small></span></label>
    <label class="row"><input type="checkbox" id="opt-ragged">
      <span><b>Ragged right</b><br><small>Align text left instead of justifying it.</small></span></label>
    <h3>examples</h3>
    <div id="examples" class="examples"></div>
    <p class="fine">pocketview <span id="version"></span> · <a href="https://github.com/frobnitzem/pocketview">source</a> ·
      Apache-2.0 · <a href="licenses/THIRD_PARTY_NOTICES.md">third-party notices</a></p>
  </form>
</dialog>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
