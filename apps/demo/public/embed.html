<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pocketview embedding example</title>
<!-- The viewer's styles and fonts, then a box of fixed size for it. -->
<link rel="stylesheet" href="./lib/pocketview.css">
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; }
  .viewer { width: 100%; height: 460px; border-radius: 12px; }
  .small { width: 360px; max-width: 100%; height: 300px; }
</style>
</head>
<body>
<h1>Embedding pocketview</h1>
<p>Each box below is a <code>div</code> with a fixed size; <code>mount()</code> fills it.</p>
<div id="manifest" class="viewer"></div>
<p><button id="swap">Show another document</button></p>
<div id="small" class="viewer small"></div>

<script type="module">
  import { mount } from './lib/pocketview.js';

  const manifest = {
    name: 'pocketview',
    license: 'Apache-2.0',
    keywords: ['json', 'yaml', 'viewer', 'typesetting'],
    author: { name: 'David M. Rogers', url: 'https://github.com/frobnitzem' },
    packages: [
      { name: '@pocketview/typeset', role: 'Knuth-Plass line breaking with hyphenation' },
      { name: '@pocketview/core', role: 'measure, plan and the navigation contracts' },
      { name: '@pocketview/view', role: 'the embeddable viewer' },
    ],
  };
  const viewer = mount(document.getElementById('manifest'), manifest, {
    label: 'package',
    onFocus: (ptr) => console.log('target shows', ptr || '(root)'),
  });
  document.getElementById('swap').addEventListener('click', () => {
    viewer.show({ planets: ['Mercury', 'Venus', 'Earth', 'Mars'], moons: { Earth: 1, Mars: 2 } }, 'solar system');
  });

  mount(document.getElementById('small'), manifest, { label: 'package', theme: 'lux' });
  window.viewer = viewer; // for the end-to-end test
</script>
</body>
</html>
